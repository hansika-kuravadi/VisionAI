
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionAI - Free Video Creator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #101323;
            color: white;
        }

        .container {
            max-width: 850px;
            margin: auto;
            padding: 30px;
            background: #1b2036;
            border-radius: 16px;
        }

        h1 {
            text-align: center;
            color: #8b9cff;
        }

        .subtitle {
            text-align: center;
            color: #c5c9dc;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 20px 0 10px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555d7c;
            background: #252c45;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #687cff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5266ed;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .preview-item {
            background: #252c45;
            padding: 10px;
            border-radius: 10px;
        }

        .preview-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 7px;
        }

        .preview-item input {
            margin-top: 8px;
        }

        .status {
            margin-top: 20px;
            text-align: center;
            color: #aebaff;
        }

        .video-section {
            margin-top: 35px;
            text-align: center;
        }

        video {
            width: 100%;
            max-height: 450px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .download {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 25px;
            background: #20a878;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .note {
            margin-top: 25px;
            color: #aeb5ce;
            font-size: 13px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 VisionAI</h1>

    <p class="subtitle">
        Create videos from your own images for free.
        Upload pictures, add captions and generate an MP4 video.
    </p>

    <label for="images">📸 Upload Images (Maximum 20)</label>
    <input type="file" id="images" accept="image/*" multiple>

    <p id="imageCount">No images selected.</p>

    <div id="previewGrid" class="preview-grid"></div>

    <label for="duration">⏱️ Duration Per Image</label>

    <select id="duration">
        <option value="2">2 Seconds</option>
        <option value="3" selected>3 Seconds</option>
        <option value="5">5 Seconds</option>
        <option value="10">10 Seconds</option>
    </select>

    <button id="createBtn" onclick="createVideo()">
        🎥 Create Free Video
    </button>

    <p id="status" class="status"></p>

    <div id="videoSection" class="video-section hidden">

        <h2>🎬 Video Preview</h2>

        <video id="video" controls></video>

        <br>

        <a id="download" class="download" download="visionai_video.mp4">
            ⬇️ Download Video
        </a>

    </div>

    <p class="note">
        VisionAI uses your uploaded images to create a slideshow video.
        This free version does not generate new AI video footage.
    </p>

</div>

<script>
    // Your deployed Render backend
    const API_BASE_URL = "https://visionai-backend-85ux.onrender.com";

    const imageInput = document.getElementById("images");
    const previewGrid = document.getElementById("previewGrid");
    const imageCount = document.getElementById("imageCount");
    const statusText = document.getElementById("status");
    const createBtn = document.getElementById("createBtn");

    let selectedFiles = [];

    imageInput.addEventListener("change", function () {

        selectedFiles = Array.from(this.files);

        previewGrid.innerHTML = "";

        if (selectedFiles.length > 20) {
            alert("Please select a maximum of 20 images.");
            this.value = "";
            selectedFiles = [];
            imageCount.textContent = "No images selected.";
            return;
        }

        imageCount.textContent =
            selectedFiles.length + " image(s) selected.";

        selectedFiles.forEach((file, index) => {

            const reader = new FileReader();

            reader.onload = function (event) {

                const item = document.createElement("div");
                item.className = "preview-item";

                const img = document.createElement("img");
                img.src = event.target.result;

                const caption = document.createElement("input");
                caption.type = "text";
                caption.placeholder = "Scene " + (index + 1) + " caption";
                caption.className = "caption";

                item.appendChild(img);
                item.appendChild(caption);

                previewGrid.appendChild(item);
            };

            reader.readAsDataURL(file);
        });
    });


    async function createVideo() {

        if (selectedFiles.length === 0) {
            alert("Please upload at least one image.");
            return;
        }

        createBtn.disabled = true;
        createBtn.textContent = "Creating Video...";

        statusText.textContent =
            "Connecting to VisionAI server. Please wait...";

        document.getElementById("videoSection").classList.add("hidden");

        const formData = new FormData();

        selectedFiles.forEach(file => {
            formData.append("images", file);
        });

        const captions = Array.from(
            document.querySelectorAll(".caption")
        ).map(input => input.value || "");

        formData.append("captions", captions.join("|"));

        formData.append(
            "seconds_per_image",
            document.getElementById("duration").value
        );

        try {

            const response = await fetch(
                `${API_BASE_URL}/create-free-video`,
                {
                    method: "POST",
                    body: formData
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.detail || "Video creation failed."
                );
            }

            if (!result.video_url) {
                throw new Error("The server did not return a video URL.");
            }

            // Convert the local backend URL into the deployed Render URL
            const videoUrl =
                API_BASE_URL + new URL(result.video_url).pathname;

            const video = document.getElementById("video");

            video.src = videoUrl;

            document.getElementById("download").href = videoUrl;

            document.getElementById("videoSection").classList.remove("hidden");

            statusText.textContent = "✅ Your video is ready!";

        } catch (error) {

            statusText.textContent =
                "❌ Error: " + error.message;

        } finally {

            createBtn.disabled = false;
            createBtn.textContent = "🎥 Create Free Video";

        }
    }
</script>

</body>
</html>
